<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#31102F" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#F97316" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad)" />
  <circle cx="650" cy="120" r="220" fill="url(#accentGrad)" />
  <circle cx="160" cy="400" r="180" fill="url(#accentGrad)" />
  <!-- Barbell Graphic -->
  <g stroke="#F43F5E" stroke-opacity="0.45" stroke-width="8" stroke-linecap="round">
    <line x1="240" y1="250" x2="560" y2="250" />
    <rect x="200" y="190" width="24" height="120" rx="6" fill="#0F172A" />
    <rect x="168" y="210" width="20" height="80" rx="5" fill="#0F172A" />
    <rect x="576" y="190" width="24" height="120" rx="6" fill="#0F172A" />
    <rect x="612" y="210" width="20" height="80" rx="5" fill="#0F172A" />
  </g>
</svg>
